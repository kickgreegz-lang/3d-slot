# chr_monty master cut (art/source/mascots/pipeline/mastercut.py, run through tools/mhart/mascot/build.sh).
# Master = the approved three-quarter view art/source/magpie-heist/mascot/monty_static.png (2nd figure of the
# design sheet mh_mascot_monty_sheet.raw.v01, matted, straight alpha, 862x1448 = 2x the landscape mascot rect
# height). He faces screen-RIGHT: near side = his R (screen-left arm, the leg whose foot is lowest).
# The setup pose is the master pixel for pixel; every area a moving part uncovers is filled (inpaint /
# painted gradients, then an ink stroke on the new silhouette only where hidden at rest). Eye states are
# painted over the master's own eye patch; the fist / point hands are painted by tools/mhart/mascot/hands.py
# under the master's own glove cuff (no part sheets exist for Monty).
# All coordinates: master px (862x1448, y down). Canvas 880x1448 @2x, root = feet point (master 430, 1440).
