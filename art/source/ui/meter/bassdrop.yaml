# ui_groove_meter clips (ANIMATION_SET 3), applied by tools/spine/examples/bass_drop/bdgen.py. Frames at 30 fps.
# Tracks: 0 state (idle / heat_loop / armed_loop / overdrive_loop / charge / charge_chained / boom / feature_trigger),
# 1 one-shots (tick / pump / drain), 2 notch overlays (threshold_minor / threshold_major). Overlays start and end on
# the setup pose, so the runtime may play them additively or not. Events are garnish hooks only.
kind: ui

slots:
  - {name: led_arc, bone: led_arc, after: rim_trim}        # code-drawn 60-tick LED arc (DESIGN 8)
  - {name: txt_count, bone: txt_count, after: fx_cap}      # live counter "23/60"
  - {name: notch_2, bone: notch_2, after: notch_1}
  - {name: notch_3, bone: notch_3, after: notch_2}
  - {name: notch_4, bone: notch_4, after: notch_3}
  - {name: notch_5, bone: notch_5, after: notch_4}
  - {name: notch_6, bone: notch_6, after: notch_5}
  - {name: fx_blast, bone: fx_blast, after: fx_burst}      # fx_speaker_blast flipbook (runtime)
  - {name: chip, bone: chip_anchor, after: fx_blast}       # the next-drop chip plate (runtime)

# skins: base / jukejam / megamix carry the cabinet and their trim colour as `trim`; bare (compact) has no cabinet.
# All three trims also stay in the default skin by their own names, so a compact feature mode can combine `bare`
# with setAttachment('rim_trim', 'trim_jukejam').
skins:
  base: [cabinet_back, grill_cloth, cabinet_front]
  jukejam: [cabinet_back, grill_cloth, cabinet_front]
  megamix: [cabinet_back, grill_cloth, cabinet_front]
skins_copy:
  base: [trim_base]
  jukejam: [trim_jukejam]
  megamix: [trim_megamix]
  bare: [trim_base]
skin_rename:
  base: {rim_trim: {trim_base: trim}}
  jukejam: {rim_trim: {trim_jukejam: trim}}
  megamix: {rim_trim: {trim_megamix: trim}}
  bare: {rim_trim: {trim_base: trim}}
setup:
  rim_trim: trim
  notch_1: notch_w1_off        # 10: one wild
  notch_2: notch_w1_off        # 20: one wild
  notch_3: notch_w2_off        # 30: two wilds
  notch_4: notch_jj_off        # 40: Juke Jam
  notch_5: notch_w3_off        # 50: three wilds
  notch_6: notch_mm_off        # 60: Mega Mix
clone: {notch_2: notch_1, notch_3: notch_1, notch_4: notch_1, notch_5: notch_1, notch_6: notch_1}
radial_weights:
  cone: {centre: [380, 440], inner: [cone, 150], outer: [ring, 222]}
# soft glows and the thin trim bands are stored at half resolution (tools/spine/examples/bass_drop/cut/cut_meter.py)
region_scale: {glow_ring: 2, swirl: 2, cap_flash: 2, trim_base: 2, trim_jukejam: 2, trim_megamix: 2}

clips:
  # ---------------------------------------------------------------- track 0 states
  idle:                        # 4 beats @100 BPM: the cone breathes 1.00 -> 1.02 per beat; dim rim glow slowly sweeping
    frames: 72
    loop: true
    bones:
      cone: {scale: [[0, 1, quad_out], [3, 1.02, sine_in_out], [12, 1], [18, 1, quad_out], [21, 1.02, sine_in_out], [30, 1],
                     [36, 1, quad_out], [39, 1.02, sine_in_out], [48, 1], [54, 1, quad_out], [57, 1.02, sine_in_out], [66, 1], [72, 1]]}
      fx_glow: {rotate: [[0, 0, linear], [72, -360]]}
    slots:
      fx_glow: {alpha: [[0, 0.25], [72, 0.25]]}
  heat_loop:                   # ~1.9 Hz swell with a flutter, rim shimmer sweeping once per loop
    frames: 16
    loop: true
    bones:
      cone: {scale: [[0, 1], [2, 1.018], [4, 1.012], [6, 1.035], [8, 1.028], [10, 1.04], [12, 1.03], [14, 1.018], [16, 1]]}
      fx_glow: {rotate: [[0, 0, linear], [16, -360]]}
    slots:
      fx_glow: {alpha: [[0, 0.45, sine_in_out], [8, 0.85, sine_in_out], [16, 0.45]]}
  armed_loop:                  # 2 Hz: the swirl turns, the cone vibrates +-1.5 units
    frames: 15
    loop: true
    bones:
      fx_swirl: {rotate: [[0, 0, linear], [15, -360]], scale: [[0, 0.95, sine_in_out], [7, 1.05, sine_in_out], [15, 0.95]]}
      cone: {translate: [[0, [0, 0], linear], [2, [1.5, 0], linear], [4, [-1.5, 0.5], linear], [6, [1.2, -1], linear],
                         [8, [-1, 1], linear], [10, [1.5, 0], linear], [12, [-1.2, -0.5], linear], [15, [0, 0]]]}
    slots:
      fx_swirl: {alpha: [[0, 0.35, sine_in_out], [7, 0.5, sine_in_out], [15, 0.35]]}
      fx_glow: {alpha: [[0, 0.6, sine_in_out], [7, 0.9, sine_in_out], [15, 0.6]]}
  overdrive_loop:              # MAX: pink sparks swirling, rim pulse at 1.25 Hz
    frames: 24
    loop: true
    bones:
      ring: {scale: [[0, 1, expo_out], [3, 1.02, sine_in_out], [12, 1], [24, 1]]}
      fx_swirl: {rotate: [[0, 0, linear], [24, -360]]}
      fx_glow: {rotate: [[0, 0, linear], [24, 360]]}
    slots:
      fx_glow: {rgba: [[0, ff4fb4ff], [24, ff4fb4ff]], alpha: [[0, 0.6, expo_out], [3, 1.0, sine_in_out], [24, 0.6]]}
      fx_swirl: {rgba: [[0, ff6fc4ff], [24, ff6fc4ff]], alpha: [[0, 0.45, sine_in_out], [12, 0.7, sine_in_out], [24, 0.45]]}
  charge:                      # the cone pulls back (power2.in), the cabinet squashes, the swirl spins up, glow to 1
    frames: 15
    events: [{name: charge_start, at: 0}]
    bones:
      cone: {scale: [[0, 1, quad_in], [15, 0.88]]}
      cabinet: {scale: [[0, 1, quad_in], [15, [1.03, 0.94]]]}
      fx_swirl: {rotate: [[0, 0, quad_in], [15, -180]]}
    slots:
      fx_swirl: {alpha: [[0, 0, quad_in], [15, 1]]}
      fx_glow: {alpha: [[0, 0.25, quad_in], [15, 1]]}
  charge_chained:              # the short version: the swirl is already spinning
    frames: 6
    events: [{name: charge_start, at: 0}]
    bones:
      cone: {scale: [[0, 1, quad_in], [6, 0.88]]}
      cabinet: {scale: [[0, 1, quad_in], [6, [1.03, 0.94]]]}
      fx_swirl: {rotate: [[0, 0, quad_in], [6, -180]]}
    slots:
      fx_swirl: {alpha: [[0, 0.6, quad_in], [6, 1]]}
      fx_glow: {alpha: [[0, 0.5, quad_in], [6, 1]]}
  boom:                        # f1 cone 1.20, f5 0.96, f8 1.04, f14 1.00; cabinet sy 1.08 at f1, settled by f12
    frames: 18
    events: [{name: boom, at: 0}]
    bones:
      cone: {scale: [[0, 0.88, expo_out], [1, 1.2, sine_in_out], [5, 0.96, sine_in_out], [8, 1.04, sine_in_out], [14, 1], [18, 1]]}
      cabinet: {scale: [[0, [1.03, 0.94], expo_out], [1, [0.96, 1.08], sine_in_out], [5, [1.02, 0.97], sine_in_out], [9, [0.995, 1.015]], [12, 1], [18, 1]]}
      ring: {scale: [[0, 1, expo_out], [1, 1.03, sine_in_out], [6, 1], [18, 1]]}
      fx_swirl: {rotate: [[0, -180, expo_out], [6, -330, sine_in_out], [18, -360]]}
      fx_glow: {scale: [[0, 1, expo_out], [1, 1.08, sine_in_out], [8, 1], [18, 1]]}
    slots:
      fx_swirl: {alpha: [[0, 1, expo_out], [1, 0.9, quad_in], [10, 0], [18, 0]]}
      fx_glow: {alpha: [[0, 1], [2, 1, quad_in], [12, 0.25], [18, 0.25]]}
      fx_cap: {alpha: [[0, 0, expo_out], [1, 0.9, quad_in], [8, 0], [18, 0]]}
  feature_trigger:             # three pumps on the beat (1.12 / 1.16 / 1.30), the third stretches the cabinet; -> overdrive
    frames: 54
    events: [{name: pump_hit, at: 0}, {name: pump_hit, at: 18}, {name: pump_hit, at: 36}]
    bones:
      cone: {scale: [[0, 1, expo_out], [1, 1.12, sine_in_out], [6, 0.98], [12, 1], [18, 1, expo_out], [19, 1.16, sine_in_out],
                     [24, 0.97], [30, 1], [36, 1, expo_out], [37, 1.3, sine_in_out], [42, 0.95, sine_in_out], [46, 1.03], [50, 1], [54, 1]]}
      cabinet: {scale: [[0, 1], [36, 1, expo_out], [37, [0.95, 1.12], sine_in_out], [42, [1.02, 0.97], sine_in_out], [47, 1], [54, 1]]}
      ring: {scale: [[0, 1, expo_out], [1, 1.015], [6, 1], [18, 1, expo_out], [19, 1.02], [24, 1], [36, 1, expo_out], [37, 1.04], [44, 1], [54, 1]]}
      fx_swirl: {rotate: [[0, 0, quad_in], [36, -540, expo_out], [54, -720]]}
      fx_glow: {rotate: [[0, 0], [54, 0]], scale: [[0, 1], [36, 1, expo_out], [37, 1.1, sine_in_out], [44, 1], [54, 1]]}
    slots:
      fx_glow: {rgba: [[0, ffffffff], [30, ffffffff, sine_in_out], [36, ff4fb4ff], [54, ff4fb4ff]],
                alpha: [[0, 0.5, expo_out], [1, 0.9], [12, 0.5], [18, 0.5, expo_out], [19, 0.95], [30, 0.5], [36, 0.5, expo_out], [37, 1], [54, 0.6]]}
      fx_swirl: {rgba: [[0, ffffffff], [30, ffffffff, sine_in_out], [36, ff6fc4ff], [54, ff6fc4ff]],
                 alpha: [[0, 0.2, quad_in], [36, 0.8, expo_out], [54, 0.45]]}
      fx_cap: {alpha: [[0, 0, expo_out], [1, 0.6], [8, 0], [18, 0, expo_out], [19, 0.7], [26, 0], [36, 0, expo_out], [37, 1], [46, 0], [54, 0]]}

  # ---------------------------------------------------------------- track 1 one-shots
  tick:                        # orb arrival: cone 1.00 -> 1.03 -> 1.00, dust-cap flash
    frames: 4
    bones:
      cone: {scale: [[0, 1, expo_out], [1, 1.03, sine_in_out], [4, 1]]}
    slots:
      fx_cap: {alpha: [[0, 0, expo_out], [1, 0.45, quad_in], [4, 0]]}
  pump:                        # big-win tier punch / music accents: cone 1.08
    frames: 6
    bones:
      cone: {scale: [[0, 1, expo_out], [1, 1.08, sine_in_out], [3, 0.99, sine_in_out], [6, 1]]}
    slots:
      fx_cap: {alpha: [[0, 0, expo_out], [1, 0.4, quad_in], [6, 0]]}
  drain:                       # the cone relaxes, the glow fades (the code drains the LEDs over the same 400 ms)
    frames: 12
    bones:
      cone: {scale: [[0, 1, sine_in_out], [3, 0.97, sine_in_out], [12, 1]]}
    slots:
      fx_glow: {alpha: [[0, 0, quad_out], [1, 0.5, quad_in], [12, 0]]}

  # ---------------------------------------------------------------- track 2 notch overlays (fx_notch = the active notch)
  threshold_minor:             # the notch ignites: burst star 0 -> 1.6, a rim flash runs once around
    frames: 15
    events: [{name: threshold_hit, at: 2}]
    bones:
      fx_notch: {scale: [[0, 1], [1, 1, stepped], [2, 0.2, expo_out], [5, 1.6, sine_in_out], [11, 1.2, stepped], [15, 1]]}
      fx_glow: {rotate: [[0, 0], [2, 0, sine_in_out], [15, -360]]}
    slots:
      fx_burst: {alpha: [[0, 0], [2, 0, expo_out], [3, 1, sine_in_out], [11, 0], [15, 0]]}
      fx_glow: {alpha: [[0, 0], [2, 0, expo_out], [3, 0.9, sine_in_out], [15, 0]]}
  threshold_major:             # bigger: burst 2.2, the glow wave runs twice around
    frames: 27
    events: [{name: threshold_hit, at: 2}]
    bones:
      fx_notch: {scale: [[0, 1], [1, 1, stepped], [2, 0.3, expo_out], [5, 2.2, sine_in_out], [14, 1.5], [20, 1.2, stepped], [27, 1]]}
      fx_glow: {rotate: [[0, 0], [2, 0, sine_in_out], [27, -720]], scale: [[0, 1], [2, 1, expo_out], [5, 1.06], [27, 1]]}
    slots:
      fx_burst: {alpha: [[0, 0], [2, 0, expo_out], [3, 1], [14, 0.8, quad_in], [20, 0], [27, 0]]}
      fx_glow: {alpha: [[0, 0], [2, 0, expo_out], [3, 1], [20, 0.7, quad_in], [27, 0]]}
      fx_cap: {alpha: [[0, 0], [2, 0, expo_out], [3, 0.6], [12, 0], [27, 0]]}
