# sym_R Shooting Star: the Magpie Heist clip layer, applied by tools/mhart/rigs/mhgen.py after the stock generator
# (bassdrop.yaml syntax: rows [frame, value, ease leaving the key]; scale rows [sx, sy] or one number; 30 fps).
# Feel: the reveal trigger, it must look ELECTRIC. land = a bouncy squash, the star squashing on top of it, the tail
# flicking; win = crouch, pop to 1.24 while the star SPINS a full turn (5-fold: it lands on its own pose), a 10-ray
# flare and twinkles at win_peak, the tail whips; win_loop = ray pulses, star wobble, tail ripple, twinkles;
# anticipation_intro / anticipation / anticipation_out = the charge: an electric rim, arcs flickering around the
# star (spark_1..3), rays pulsing on the lub-dub, the star buzzing (stepped jitter), the tail shivering;
# idle (played once) = a tail ripple and two twinkles; explode = rays + rim flash, the tail flies off, twinkles burst.
kind: special
cell: 376                # content 318 (cellScale 1.06) + a bouncy rebound: the land gate needs 376 (tools/spine/README "Headroom")
untouched: [fx_rays, fx_rim, fx_spark, fx_twinkle_1]     # keyed here (the generator keys fx slots as a glow)
region_scale: {glow: 2, rays: 2}                          # soft sprites stored at half resolution
slots:
  - {name: fx_twinkle_2, bone: fx_twinkle_2, after: fx_twinkle_1, blend: additive, color: ffffff00}
clone: {fx_twinkle_2: fx_twinkle_1}

clips:
  land:
    merge: true
    bones:
      phys_tail_1: {rotate: [[0, 0, expo_out], [2, 8], [5, -6], [8, 3], [12, 0]]}
      phys_tail_2: {rotate: [[0, 0, expo_out], [3, 8], [6, -6], [9, 3], [12, 0]]}
      phys_tail_3: {rotate: [[0, 0, expo_out], [4, 7], [7, -5], [10, 2], [12, 0]]}

  win:
    merge: true
    bones:
      star: {rotate: [[0, 0, sine_out], [4, 10, cubic_out], [17, -360], [24, -360]],
             scale: [[0, 1, sine_out], [4, [1.08, 0.9], expo_out], [8, [0.93, 1.09]], [12, 1.03], [16, 1], [24, 1]]}
      phys_tail_1: {rotate: [[0, 0, sine_out], [4, -8, expo_out], [8, 16], [12, -10], [16, 5], [20, -2], [24, 0]]}
      phys_tail_2: {rotate: [[0, 0, sine_out], [5, -8, expo_out], [9, 16], [13, -10], [17, 5], [21, -2], [24, 0]]}
      phys_tail_3: {rotate: [[0, 0, sine_out], [6, -6, expo_out], [10, 14], [14, -9], [18, 4], [22, -1], [24, 0]]}
      fx_rays: {rotate: [[0, 36], [7, 36, expo_out], [24, 0]], scale: [[0, 0.5], [7, 0.5, expo_out], [10, 1.3], [24, 1.05]]}
      fx_twinkle_1: {scale: [[0, 0.3], [8, 0.3, back_out], [11, 1.3], [16, 0.4], [24, 0.3]], rotate: [[0, 0], [8, 0], [16, 60], [24, 60]]}
      fx_twinkle_2: {scale: [[0, 0.3], [11, 0.3, back_out], [14, 1.2], [19, 0.4], [24, 0.3]], rotate: [[0, 0], [11, 0], [19, -60], [24, -60]]}
    slots:
      fx_rays: {alpha: [[0, 0], [7, 0, expo_out], [9, 1], [16, 0.55], [24, 0.45]]}
      fx_twinkle_1: {alpha: [[0, 0], [8, 0, quad_out], [10, 1], [16, 0], [24, 0]]}
      fx_twinkle_2: {alpha: [[0, 0], [11, 0, quad_out], [13, 1], [19, 0], [24, 0]]}

  win_loop:
    merge: true
    bones:
      star: {rotate: [[0, 0], [4, -4], [10, 2], [16, 0], [22, 0], [26, 4], [32, -2], [38, 0], [44, 0]]}
      fx_rays: {rotate: [[0, 0], [11, -8], [33, 8], [44, 0]],
                scale: [[0, 1.05, quad_out], [3, 1.18], [11, 1.05], [22, 1.05, quad_out], [25, 1.18], [33, 1.05], [44, 1.05]]}
      phys_tail_1: {rotate: [[0, 0], [11, 6], [33, -6], [44, 0]]}
      phys_tail_2: {rotate: [[0, 0], [14, 6], [36, -6], [44, 0]]}
      phys_tail_3: {rotate: [[0, 0], [17, 5], [39, -5], [44, 0]]}
      fx_twinkle_1: {scale: [[0, 0.3], [8, 0.3, back_out], [11, 1.2], [16, 0.4], [44, 0.3]], rotate: [[0, 60], [8, 0], [16, 60], [44, 60]]}
      fx_twinkle_2: {scale: [[0, 0.3], [28, 0.3, back_out], [31, 1.1], [36, 0.4], [44, 0.3]], rotate: [[0, -60], [28, 0], [36, -60], [44, -60]]}
    slots:
      fx_rays: {alpha: [[0, 0.45, quad_out], [3, 0.8], [11, 0.4], [22, 0.45, quad_out], [25, 0.8], [33, 0.4], [44, 0.45]]}
      fx_twinkle_1: {alpha: [[0, 0], [8, 0, quad_out], [10, 1], [16, 0], [44, 0]]}
      fx_twinkle_2: {alpha: [[0, 0], [28, 0, quad_out], [30, 1], [36, 0], [44, 0]]}

  # ------------------------------------------------------------------ the charge (reveal trigger)
  anticipation_intro:
    merge: true
    bones:
      star: {rotate: [[0, 0], [3, 0, stepped], [4, 3, stepped], [5, -3, stepped], [6, 2, stepped], [7, -2, stepped], [8, 1, stepped], [9, 0]],
             scale: [[0, 1, quad_in], [2, [1.06, 0.92], expo_out], [5, [0.96, 1.06]], [9, 1]]}
      fx_rays: {scale: [[0, 0.4, expo_out], [6, 1.1], [9, 1.0]]}
      phys_tail_1: {rotate: [[0, 0, expo_out], [3, -10], [6, 6], [9, 0]]}
    slots:
      fx_rim: {alpha: [[0, 0], [2, 0, expo_out], [5, 1], [9, 0.8]]}
      fx_rays: {alpha: [[0, 0], [2, 0, expo_out], [6, 0.6], [9, 0.35]]}
      fx_spark: {attachment: [[0, spark_1], [4, spark_3], [6, spark_2], [8, spark_1]],
                 alpha: [[0, 0], [3, 0, stepped], [4, 1], [5, 0.3, stepped], [6, 1], [7, 0.4, stepped], [8, 0.9], [9, 0.9]]}
  anticipation:
    merge: true
    bones:
      # buzzing: stepped jitter (30 fps), never a smooth wobble
      star: {rotate: [[0, 0, stepped], [1, 2.5, stepped], [2, -2, stepped], [3, 1.5, stepped], [4, -2.5, stepped], [5, 2, stepped],
                      [6, -1.5, stepped], [7, 0, stepped], [8, 2.5, stepped], [9, -2, stepped], [10, 1.5, stepped],
                      [11, -2.5, stepped], [12, 2, stepped], [13, -1, stepped], [14, 1, stepped], [15, -1, stepped], [16, 0]]}
      fx_rays: {rotate: [[0, 0], [8, -10], [16, 0]], scale: [[0, 1.0, quad_out], [2, 1.16], [4, 1.02, quad_out], [6, 1.12], [11, 1.0], [16, 1.0]]}
      phys_tail_1: {rotate: [[0, 0], [2, -5], [4, 3], [6, -4], [8, 2], [10, -3], [12, 2], [14, -1], [16, 0]]}
      phys_tail_2: {rotate: [[0, 0], [3, -5], [5, 3], [7, -4], [9, 2], [11, -3], [13, 2], [16, 0]]}
      fx_twinkle_1: {scale: [[0, 1, stepped], [3, 0.3, back_out], [5, 1.15], [9, 0.3, stepped], [10, 1], [16, 1]], rotate: [[0, 0], [3, 0], [9, 45, stepped], [10, 0], [16, 0]]}
      fx_twinkle_2: {scale: [[0, 1, stepped], [10, 0.3, back_out], [12, 1.05], [15, 0.4, stepped], [16, 1]], rotate: [[0, 0], [10, 0], [15, -40, stepped], [16, 0]]}
    slots:
      fx_rim: {alpha: [[0, 0.8], [1, 1, stepped], [2, 0.55], [3, 1], [4, 0.7], [6, 1, stepped], [7, 0.6], [9, 1], [11, 0.65], [13, 1, stepped], [14, 0.7], [16, 0.8]]}
      fx_rays: {alpha: [[0, 0.35, quad_out], [2, 0.75], [4, 0.45, quad_out], [6, 0.65], [11, 0.35], [16, 0.35]]}
      fx_spark: {attachment: [[0, spark_1], [2, spark_2], [4, null], [5, spark_3], [7, spark_1], [9, null], [10, spark_2], [12, spark_3], [14, null], [15, spark_2], [16, spark_1]],
                 alpha: [[0, 0.9], [1, 0.4, stepped], [2, 1], [3, 0.5, stepped], [5, 1], [6, 0.35, stepped], [7, 1], [8, 0.5, stepped],
                         [10, 1], [11, 0.4, stepped], [12, 1], [13, 0.5, stepped], [15, 1], [16, 0.9]]}
      fx_twinkle_1: {alpha: [[0, 0], [3, 0, quad_out], [5, 1], [9, 0], [16, 0]]}
      fx_twinkle_2: {alpha: [[0, 0], [10, 0, quad_out], [12, 1], [16, 0]]}
  anticipation_out:
    merge: true
    bones:
      fx_rays: {scale: [[0, 1.0], [6, 1.3, stepped], [7, 1.0], [8, 1.0]]}
    slots:
      fx_rim: {alpha: [[0, 0.8, quad_out], [5, 0], [8, 0]]}
      fx_rays: {alpha: [[0, 0.35, quad_out], [6, 0], [8, 0]]}
      fx_spark: {attachment: [[0, spark_1], [3, spark_3], [5, spark_1]], alpha: [[0, 0.9], [2, 0.4, stepped], [3, 0.8], [5, 0], [8, 0]]}

  idle:
    merge: true
    bones:
      phys_tail_1: {rotate: [[0, 0], [6, 0, quad_out], [10, 9], [16, -7], [22, 3.5], [28, -1.2], [34, 0], [72, 0]]}
      phys_tail_2: {rotate: [[0, 0], [9, 0, quad_out], [13, 9], [19, -7], [25, 3.5], [31, -1.2], [37, 0], [72, 0]]}
      phys_tail_3: {rotate: [[0, 0], [12, 0, quad_out], [16, 8], [22, -6], [28, 3], [34, -1], [40, 0], [72, 0]]}
      star: {rotate: [[0, 0], [38, 0, quad_out], [41, -6], [45, 4], [49, -1.5], [53, 0], [72, 0]]}
      fx_twinkle_1: {scale: [[0, 0.3], [8, 0.3, back_out], [11, 1.25], [17, 0.4], [72, 0.3]], rotate: [[0, 0], [8, 0], [17, 50, stepped], [18, 0], [72, 0]]}
      fx_twinkle_2: {scale: [[0, 0.3], [40, 0.3, back_out], [43, 1.15], [49, 0.4], [72, 0.3]], rotate: [[0, 0], [40, 0], [49, -50, stepped], [50, 0], [72, 0]]}
    slots:
      fx_twinkle_1: {alpha: [[0, 0], [8, 0, quad_out], [10, 1], [17, 0], [72, 0]]}
      fx_twinkle_2: {alpha: [[0, 0], [40, 0, quad_out], [42, 1], [49, 0], [72, 0]]}

  explode:
    merge: true
    override: true
    bones:
      fx_rays: {scale: [[0, 0.6], [2, 0.6, expo_out], [6, 1.6], [13, 1.8]], rotate: [[0, 0], [2, 0, expo_out], [13, -25]]}
      fx_twinkle_1: {translate: [[0, [0, 0]], [2, [0, 0], expo_out], [10, [-36, 30]], [13, [-40, 34]]], scale: [[0, 0.4], [2, 0.4, back_out], [5, 1.3], [13, 0.5]]}
      fx_twinkle_2: {translate: [[0, [0, 0]], [2, [0, 0], expo_out], [10, [30, -26]], [13, [34, -30]]], scale: [[0, 0.4], [3, 0.4, back_out], [6, 1.2], [13, 0.5]]}
      phys_tail_1: {rotate: [[0, 0, quad_in], [2, -6, expo_out], [7, 22], [13, 28]]}
      phys_tail_2: {rotate: [[0, 0, quad_in], [2, -6, expo_out], [8, 20], [13, 26]]}
    slots:
      star: {alpha: [[0, 1], [4, 1, quad_in], [10, 0], [13, 0]]}
      tail: {alpha: [[0, 1], [3, 1, quad_in], [9, 0], [13, 0]]}
      fx_rays: {alpha: [[0, 0], [1, 0, expo_out], [2, 1], [9, 0], [13, 0]]}
      fx_rim: {alpha: [[0, 0], [1, 0, expo_out], [2, 1], [4, 0], [13, 0]]}
      fx_spark: {attachment: [[0, spark_1], [2, spark_2], [4, spark_3], [6, spark_1]], alpha: [[0, 0], [1, 0, stepped], [2, 1], [4, 0.8], [7, 0], [13, 0]]}
      fx_twinkle_1: {alpha: [[0, 0], [2, 0, quad_out], [4, 1], [11, 0], [13, 0]]}
      fx_twinkle_2: {alpha: [[0, 0], [3, 0, quad_out], [5, 1], [11, 0], [13, 0]]}
