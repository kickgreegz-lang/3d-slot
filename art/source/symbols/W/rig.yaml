# sym_W, Bass Drop wild (docs/games/bass-drop/ANIMATION_SET.md 2.6). Parts: art/source/symbols/W/parts.json
# (tools/spine/examples/bass_drop/cut/cut_W.py: master-cut tooth / cap / chain from sym_W_rig + the sym_W_pieces
# cuts). Coordinates: 360x360 @2x canvas, image space (y down).
# Build: tools/spine/examples/bass_drop/build.sh W [--capture dir]   (bdgen.py = stock gen.py + bassdrop.yaml: skins,
# empty txt_* slots, the CR-8 drop / sticky / multiplier clips and bass_react). Validator kind: wild (CR-8).
# 12 slots, back to front: fx_glow, fx_trail, chain, tooth, ribbon, txt_wild, cap, clamp_L, clamp_R, badge, txt_mult,
# fx_ring. (The ribbon sits under the cap's rim, where it wraps the fang.)
symbol: W
parts: parts.json
kind: special            # generator profile (the stock generator knows high | special); validator kind: wild

bones:
  - {name: tooth, parent: body, joint: [205.5, 153.2], tip: [148.9, 273.1]}
  - {name: tooth_tip, parent: tooth, joint: [148.9, 273.1], tip: [63.9, 243.1]}
  - {name: ribbon, parent: tooth, joint: [201.5, 209.8], tip: [260.0, 209.8]}
  - {name: txt_wild, parent: ribbon, joint: [201.5, 209.0]}
  - {name: cap, parent: body, joint: [207.1, 119.9], tip: [207.1, 73.3]}
  - {name: cap_rim, parent: cap, joint: [195.5, 69.3], tip: [297.4, 109.9]}      # chain base line (weights only)
  - {name: phys_chain_1, parent: cap, joint: [238.8, 39.3], tip: [238.8, 12.0]}  # the chain loop's apex (sags / jingles)
  - {name: phys_chain_2, parent: phys_chain_1, joint: [282.7, 60.0], tip: [297.4, 109.9]}   # the right-hand drop, lags the apex
  - {name: clamp_L, parent: body, joint: [101.0, 196.0], tip: [140.0, 196.0]}
  - {name: clamp_R, parent: body, joint: [304.0, 196.0], tip: [265.0, 196.0]}
  - {name: ctrl_badge_scale, parent: root, joint: [180.0, 309.0]}               # runtime scale of the plate
  - {name: badge, parent: ctrl_badge_scale, joint: [180.0, 309.0]}
  - {name: txt_mult, parent: badge, joint: [180.0, 309.0]}
  - {name: fx_glow, parent: root, joint: [180.0, 184.0]}
  - {name: fx_trail, parent: root, joint: [180.0, 184.0]}
  - {name: fx_ring, parent: root, joint: [180.0, 184.0]}

meshes:
  tooth: {type: grid, cols: 5, rows: 5, weights: {mode: idw, bones: [tooth, tooth_tip], power: 3}}
  tooth_cracked: {type: grid, cols: 5, rows: 5, weights: {mode: idw, bones: [tooth, tooth_tip], power: 3}}
  chain: {type: trace, spacing: 24, weights: {mode: idw, bones: [cap_rim, phys_chain_1, phys_chain_2], power: 3}}

physics:
  - {bone: phys_chain_1, preset: floppy, x: 0.5, y: 0.6, rotate: 0, inertia: 0.5}
  - {bone: phys_chain_2, preset: floppy, x: 0.4, y: 0.5, rotate: 0, inertia: 0.6}

motion:
  idle: {frames: 90}
  win: {pop: 1.25}
  win_loop: {frames: 45, beats: 2}
  explode: {frames: 15, burst_frame: 2, fade_from: 6, scatter: 80, spin: 40, burst_scale: 1.15, end_scale: 1.2, body_fade: [3, 8]}
  appear: {frames: 9}
  blur: {frames: 1}

accents:
  win:
    - {bone: badge, type: pump, amount: 0.15, at: peak}
    - {bone: ribbon, type: wiggle, amount: 5, at: peak, count: 3}
  win_loop:
    - {bone: tooth, type: sway, amount: 4, cycles: 1}
  land:
    - {bone: ribbon, type: squash, amount: 0.12, at: impact+1}
